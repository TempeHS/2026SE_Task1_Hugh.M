{% extends 'layout.html' %} {% block content %}
<div class="container">
  <div class="row">
    <h1>Create New Developer Log</h1>
  </div>
</div>
<div class="container">
  <div class="row">
    <form action="/form_add_devlogs.html" method="POST" class="box">
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >Developer Name</label
        >
        <input
          class="form-control"
          id="exampleFormControlInput1"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="E.g. John Gamedev"
        />
      </div>
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >Project</label
        >
        <input
          class="form-control"
          id="exampleFormControlInput1"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="Name of Project"
        />
      </div>
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >Start time</label
        >
        <input
          class="form-control"
          type="datetime-local"
          id="datetimepicker"
          data-mdb-disable-future="true"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="00:00am/pm DD/MM/YYYY"
        />
      </div>
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >End time</label
        >
        <input
          class="form-control"
          type="datetime-local"
          id="datetimepicker"
          data-mdb-disable-future="true"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="00:00am/pm DD/MM/YYYY"
        />
      </div>
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >Diary Entry</label
        >
        <input
          class="form-control"
          type="datetime-local"
          id="datetimepicker"
          data-mdb-disable-future="true"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="00:00am/pm DD/MM/YYYY"
        />
      </div>
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >Time worked</label
        >
        <input
          class="form-control"
          id="exampleFormControlInput1"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="Time elapsed while working"
        />
      </div>
      <div class="col-auto">
        <label name="exampleFormControlInput1" class="form-label"
          >Repository</label
        >
        <input
          class="form-control"
          id="exampleFormControlInput1"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2, 4}$"
          placeholder="E.g. https://github.com/EXAMPLE/REPOSITORY"
        />
      </div>
      <div class="col-auto">
        <label for="exampleFormControlTextarea1" class="form-label"
          >Developer notes</label
        >
        <textarea
          class="form-control"
          name="text"
          id="exampleFormControlTextarea1"
          rows="3"
          placeholder="Any additional notes"
        ></textarea>
      </div>

      <br />
      <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Submit</button>
      </div>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    </form>
  </div>
</div>
{% endblock %}
